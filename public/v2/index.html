<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #8a8a8a;
    --soft: #5f5f5f;
    --line: #ececec;
    --pill: #f0f0f0;
    --card: #ffffff;
    --card-line: #e6e6e6;
    --tile: #f4f4f4;
    --watermark: rgb(10 10 10 / .04);
    --scrim: rgb(0 0 0 / .45);
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --fg: #ededed;
    --muted: #7d7d7d;
    --soft: #a3a3a3;
    --line: #1f1f1f;
    --pill: #1c1c1c;
    --card: #111111;
    --card-line: #222222;
    --tile: #171717;
    --watermark: rgb(237 237 237 / .05);
    --scrim: rgb(0 0 0 / .65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: "Geist", Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color .2s, color .2s; }
  body.locked { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid #005cc5; outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 672px; margin: 0 auto; padding: 32px 32px 0; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ── */
  header { margin-bottom: 48px; }
  .head-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
  .name { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .icons { display: flex; align-items: center; gap: 16px; color: var(--muted); }
  .icons a, .icons button { display: grid; place-items: center; width: 20px; height: 20px; transition: color .2s; }
  .icons a:hover, .icons button:hover { color: var(--fg); }
  .icons svg { width: 20px; height: 20px; }
  .divider { width: 1px; height: 16px; background: var(--line); }
  .sub-row { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  .tagline { color: var(--muted); font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .tagline a { color: var(--fg); opacity: .8; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-decoration-thickness: 1px; text-underline-offset: 4px; transition: opacity .2s; }
  .tagline a:hover { opacity: .6; }
  .tagline a { display: inline-flex; align-items: center; gap: 8px; }
  .uw-crest { width: 20px; height: 20px; flex-shrink: 0; object-fit: contain; border-radius: 2px; }
  .pills { display: flex; margin-right: -8px; }
  .pills a { padding: 4px 8px; border-radius: 999px; font-size: 14px; color: var(--muted); }
  .pills a.on { background: var(--pill); color: var(--fg); }

  main { flex: 1; }
  section { margin-bottom: 48px; }
  h2 { font-size: 20px; font-weight: 600; }
  h2.spaced { margin-bottom: 16px; }

  /* ── Work: rows expand in place ── */
  .job { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .job:last-child { border-bottom: 0; }
  .job-btn { width: 100%; display: flex; gap: 16px; }
  .logo { width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--tile); border: 1px solid var(--card-line); }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .logo.pad img { width: 78%; height: auto; object-fit: contain; }
  .job-main { flex: 1; min-width: 0; }
  .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .job-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; line-height: 1.25; }
  .chev { color: var(--muted); opacity: .7; transition: transform .2s, opacity .2s; flex-shrink: 0; }
  .job-btn:hover .chev { opacity: 1; }
  .job.open .chev { transform: rotate(180deg); }
  .dates { color: var(--muted); opacity: .8; font-size: 14px; white-space: nowrap; flex-shrink: 0; }
  .role { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .summary { color: var(--soft); font-size: 14px; margin-top: 8px; line-height: 1.6; }
  .bullets-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s ease, opacity .3s ease; }
  .job.open .bullets-wrap { grid-template-rows: 1fr; opacity: 1; }
  .bullets { overflow: hidden; list-style: none; margin-left: 72px; }
  .bullets li { display: flex; gap: 8px; font-size: 14px; color: var(--soft); line-height: 1.6; padding-top: 8px; }
  .bullets li::before { content: "-"; color: var(--muted); }
  .bullets b { color: var(--fg); font-weight: 500; }

  /* ── Project cards ── */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { display: block; width: 100%; border: 1px solid var(--card-line); border-radius: 12px; overflow: hidden; background: var(--card); transition: transform .3s, box-shadow .3s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgb(0 0 0 / .08); }
  .shot { position: relative; aspect-ratio: 4 / 3; background: var(--tile); overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot.white { background: #fff; }
  .shot.black { background: #000; }
  .shot.contain img { object-fit: contain; padding: 16px; }
  .shot .overlay { position: absolute; inset: 0; display: grid; place-items: center; }
  .shot .overlay img { width: 55%; height: auto; object-fit: contain; padding: 0; }
  .card-body { padding: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .card-title { font-weight: 600; font-size: 14px; }
  .tag { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .card-desc { color: var(--soft); font-size: 14px; line-height: 1.6; }

  /* ── Education ── */
  .edu { padding: 16px 0; }
  .edu-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .edu-title { font-weight: 600; font-size: 15px; }
  .edu-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .edu-desc { color: var(--soft); font-size: 14px; margin-top: 8px; line-height: 1.6; }

  /* ── Footer + watermark ── */
  footer { padding-top: 32px; border-top: 1px solid var(--line); }
  .foot { position: relative; overflow: hidden; padding-bottom: 64px; }
  .foot p { position: relative; z-index: 1; font-size: 14px; color: var(--muted); }
  .foot a:hover { color: var(--fg); }
  .watermark { position: absolute; left: 0; bottom: 0; transform: translateY(35%); font-size: clamp(80px, 20vw, 160px); font-weight: 700; line-height: 1; color: var(--watermark); white-space: nowrap; user-select: none; pointer-events: none; }

  /* ── Project detail panel (opens over the page, like the reference) ── */
  .scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 24px 16px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .panel { width: 100%; max-width: 680px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: var(--card); color: var(--fg); border: 1px solid var(--card-line); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 64px rgb(0 0 0 / .25); transform: translateY(8px) scale(.99); transition: transform .25s; }
  .scrim.show .panel { transform: none; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 24px 28px 18px; border-bottom: 1px solid var(--line); }
  .panel-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .panel-sub { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.5; }
  .panel-actions { display: flex; align-items: center; gap: 12px; color: var(--muted); padding-top: 4px; }
  .panel-actions a, .panel-actions button { display: grid; place-items: center; width: 22px; height: 22px; transition: color .2s; }
  .panel-actions a:hover, .panel-actions button:hover { color: var(--fg); }
  .panel-body { overflow-y: auto; padding: 22px 28px 32px; color: var(--soft); font-size: 15px; line-height: 1.7; }
  .panel-body > * + * { margin-top: 14px; }
  .panel-body h3 { color: var(--fg); font-size: 20px; font-weight: 600; margin-top: 28px; }
  .panel-body figure { margin-top: 18px; }
  .panel-body figcaption { font-style: italic; color: var(--soft); margin-bottom: 10px; }
  .panel-body figure img, .panel-body figure video { display: block; width: 100%; border-radius: 10px; border: 1px solid var(--card-line); background: #000; }
  .panel-body figure img.light { background: #fff; }
  .panel-body ul { padding-left: 18px; }
  .panel-body li + li { margin-top: 6px; }
  .panel-body b { color: var(--fg); font-weight: 500; }
  .panel-body a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  .meta { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 640px) {
    .wrap { padding: 24px 20px 0; }
    .grid { grid-template-columns: 1fr; }
    .job-top { flex-direction: column; gap: 2px; }
    .bullets { margin-left: 0; }
    .panel-head, .panel-body { padding-left: 20px; padding-right: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
</style>

<script>
  // Photos and videos already in public/images are reused; files new to this site live in /v2/assets
  const SHARED = {"alohamini-base.png":"micron-humanoid-robot/alohamini-base.png","baker-hughes-logo.jpg":"chart-industries/baker-hughes-logo.jpg","gv01-concept-poster.jpg":"watflight-gv-01/concept-demo-poster.jpg","gv01-concept.mp4":"watflight-gv-01/concept-demo.mp4","lcc-team-mechanical.png":"watflight-project-management/team-mechanical.png","lcc-team-propulsion.png":"watflight-project-management/team-propulsion.png","lcc-team-software.png":"watflight-project-management/team-software.png","lcc-wordmark.png":"watflight-project-management/wordmark-banner.png","logo.png":"watflight-project-management/logo.png","micron-logo-white.svg":"micron-logo/micron-logo-white.svg","micronbot-banner.jpg":"micron-humanoid-robot/banner-bg.jpg","toyota-camera-mount.jpg":"toyota-innovation-challenge/camera-mount.jpg","toyota-demo-poster.jpg":"toyota-innovation-challenge/demo-poster.jpg","toyota-gesture.mp4":"toyota-innovation-challenge/demo.mp4","toyota-gripper-and-targets.jpg":"toyota-innovation-challenge/gripper-and-targets.jpg","toyota-hand-slowdown.jpg":"toyota-innovation-challenge/hand-slowdown.jpg","toyota-pick-and-place-poster.jpg":"toyota-innovation-challenge/pick-and-place-poster.jpg","toyota-pick-and-place.mp4":"toyota-innovation-challenge/pick-and-place-demo.mp4","cryo-bulk-external-pipelines-1.png":"cryogenics-systems-modeling/bulk-external-pipelines-1.png","cryo-bulk-isometric-view.png":"cryogenics-systems-modeling/bulk-isometric-view.png","cryo-bulk-section-view.png":"cryogenics-systems-modeling/bulk-section-view.png","cryo-lng-isometric-view-2.png":"cryogenics-systems-modeling/lng-isometric-view-2.png","cryo-triflex-calc-conditions.png":"cryogenics-systems-modeling/triflex-calc-conditions.png","cryo-triflex-pipe-modeling.png":"cryogenics-systems-modeling/triflex-pipe-modeling.png","tooling-fixture-assembled.jpg":"design-of-tooling/fixture-assembled.jpg","tooling-fixture-detail.jpg":"design-of-tooling/fixture-detail.jpg","tooling-jig-assembled.jpg":"design-of-tooling/jig-assembled.jpg","tooling-jig-detail.jpg":"design-of-tooling/jig-detail.jpg"};

    {

      card: { img: "micronbot-banner.jpg", overlay: "micron-logo-white.svg" },

      body: `
        <p>A dual-arm mobile robot for Micron's SMAI and Physical Automation team, built by modifying the open-source AlohaMini platform for use on a factory floor rather than its original teleoperation and research use case.</p>
        <h3>Where it's going</h3>
        <p>Intended for the warehouse and the CR1, CR2, CR3 and Post Electrical sections of Micron's assembly and testing production line in MXA. Work in progress: adapting the AlohaMini hardware and its LeRobot-based software stack (dual-arm manipulation) to these areas. The specific use case is still being defined.</p>

        <p>Built on <a href="https://github.com/liyiteng/AlohaMini/tree/main/software" target="_blank" rel="noopener noreferrer">AlohaMini</a> by Li Yiteng and Wu Zhiyong, an open-source dual-arm mobile robot with a motorized lift, released under the Apache-2.0 License.</p>
        ${fig("alohamini-base.png", "The AlohaMini base platform", "light")}`

    {

      summary: "WATFlight's sustainable aviation vehicle, at the Engineering Design Specification stage.",

    {
      slug: "collaborative-robotic-arm", title: "Collaborative Robotic Arm", tag: "2026",
      card: { img: "toyota-poster.jpg" },
      summary: "vision-guided pick-and-place Dobot arm with hand-gesture control, built in 3 days.",
      link: "https://github.com/HurayrahB/Toyota-Innovation-Challenge",
      body: `
        <p>Built over three days for the Toyota Innovation Challenge at the University of Waterloo, sponsored by Toyota Motor Manufacturing Canada. The brief: a robotic arm that works alongside a person instead of behind a cage.</p>
        <h3>What it does</h3>
        <p>A camera finds drop-zone plates and red target blocks, a homography maps camera pixels into the arm's coordinates, and a three-phase state machine runs the pick-and-place cycle on a Dobot Magician. Targets must hold still for a run of frames before they're locked in, and the arm confirms arrival by polling its pose rather than waiting on fixed delays.</p>
        ${vid("toyota-pick-and-place.mp4", "toyota-pick-and-place-poster.jpg", "Object detection and pick-and-place")}
        <h3>Hand safety</h3>
        <p>In collaborative mode, MediaPipe hand detection runs on every frame. The moment a hand is in view the arm's velocity and acceleration drop to half, and return to normal when it leaves. In gesture mode, a hand inside the arm's table zone cancels the gesture and the arm holds its position.</p>
        ${fig("toyota-hand-slowdown.jpg", "Hand detected: the arm slows to 50% of its normal speed")}
        <h3>Gesture control</h3>
        <p>An operator can drive the arm by hand from a distance, intended for hazardous areas such as a welding line. An open palm makes the arm follow, one finger raises it and two lower it, a fist toggles the gripper and a thumbs-up sends it home. Gestures must be held for about 18 frames before they fire, and every command is clamped to safe workspace bounds.</p>
        ${vid("toyota-gesture.mp4", "toyota-demo-poster.jpg", "Gesture control demo")}
        <h3>The build</h3>
        ${fig("toyota-gripper-and-targets.jpg", "The gripper and its targets: red velcro tags and 3D-printed brake calipers")}
        ${fig("toyota-camera-mount.jpg", "The camera mount holding the vision system above the workspace")}
        <p class="meta">Woojae Kim · Hurayrah Butt · Jingkai (Jackie) Shao · Python · OpenCV · MediaPipe · Dobot Magician</p>`
    },
    {
      slug: "cryogenics-systems-modeling", title: "Cryogenics Systems Modeling", tag: "2026",
      card: { img: "cryo-poster.jpg" },
      summary: "3D models of LNG and bulk cryogenic tanks, plus a TRIFLEX pipe stress analysis.",
      body: `
        <p>Cryogenic storage design and analysis work from an internship at Chart Industries, now part of Baker Hughes.</p>
        <h3>What I did</h3>
        <p>Designed 3D models of LNG storage tanks and industrial bulk cryogenic tanks in SolidWorks, including external piping layouts (fill, withdrawal and pressure-building circuits) and section views of the inner vessel, so clients and technicians could see the completed systems clearly.</p>
        <p>Also ran a TRIFLEX pipe stress analysis on the bulk tank's internal piping, checking thermal expansion, sustained loads and displacement against ASME B31.3 allowable stresses.</p>

    {
      slug: "design-of-tooling", title: "Design of Tooling", tag: "2025",
      card: { img: "tooling-poster.jpg" },
      summary: "spring-loaded jig and single-motion fixture in SolidWorks, cutting manufacturing cost by 10%.",
      body: `
        <p>A jig and a fixture for the University of Waterloo Engineering Workshop, made to improve accuracy and repeatability in the machine shop. A jig guides the cutting tool, a fixture holds the workpiece in place.</p>
        <h3>The design</h3>
        <p>The jig uses spring-loaded hold-down clamps (design for assembly), so it needs no threaded fasteners. The fixture uses single-motion clamping in place of a screw-down clamp (design for manufacturing), cutting manufacturing cost by 10%. Both follow the 3-2-1 locating principle to fully constrain the part.</p>

    {
      slug: "launch-control-center", title: "Launch Control Center", tag: "2026",
      card: { img: "lcc-wordmark.png", cls: "black contain" },
      summary: "realtime Kanban platform for the WATFlight design team, with row-level security.",
      link: "https://github.com/Jackie-lab-maker/watflight-project-management",
      body: `
        <p>A task-management platform for the WATFlight design team: a team dashboard plus a Kanban board for every sub-team, with realtime sync and role-based edit permissions.</p>

  const chev = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

  document.getElementById("work").innerHTML = WORK.map((w, i) => `
    <div class="job" id="job-${i}">
      <button class="job-btn" type="button"${w.bullets.length ? ` aria-expanded="false" aria-controls="b-${i}"` : ""}>
        <div class="logo${w.logo.pad ? " pad" : ""}" style="${w.logo.bg ? `background:${w.logo.bg};border-color:${w.logo.bg}` : ""}">
          <img src="${A(w.logo.src)}" alt="${w.name}">
        </div>
        <div class="job-main">
          <div class="job-top">
            <div class="job-name"><span>${w.name}</span>${w.bullets.length ? chev : ""}</div>
            <span class="dates">${w.dates}</span>
          </div>
          <p class="role">${w.role}</p>
          ${w.summary ? `<p class="summary">${w.summary}</p>` : ""}
        </div>
      </button>
      <div class="bullets-wrap"><ul class="bullets" id="b-${i}">${w.bullets.map(b => `<li><span>${b}</span></li>`).join("")}</ul></div>
    </div>`).join("");

  document.querySelectorAll(".job-btn").forEach(btn => btn.closest(".job").querySelector(".bullets li") && btn.addEventListener("click", () => {
    btn.setAttribute("aria-expanded", btn.closest(".job").classList.toggle("open"));
  }));

  document.getElementById("project-grid").innerHTML = PROJECTS.map(p => `
    <button class="card" type="button" data-slug="${p.slug}">
      <div class="shot ${p.card.cls || ""}">
        <img src="${A(p.card.img)}" alt="${p.title}" loading="lazy">
        ${p.card.overlay ? `<div class="overlay"><img src="${A(p.card.overlay)}" alt=""></div>` : ""}
      </div>
      <div class="card-body">
        <div class="card-top"><span class="card-title">${p.title}</span><span class="tag">${p.tag}</span></div>
        <p class="card-desc">${p.summary}</p>
      </div>
    </button>`).join("");

  // ── Detail panel, addressed by #slug like the reference ──
  const scrim = document.getElementById("scrim");
  const link = document.getElementById("panel-link");
  let lastCard = null;

  function openPanel(slug) {
    const p = PROJECTS.find(x => x.slug === slug);
    if (!p) return closePanel(false);
    document.getElementById("panel-title").textContent = p.title;
    document.getElementById("panel-sub").textContent = p.summary;
    document.getElementById("panel-body").innerHTML = p.body;
    document.getElementById("panel-body").scrollTop = 0;
    link.style.display = p.link ? "" : "none";
    if (p.link) link.href = p.link;
    scrim.classList.add("show");
    scrim.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    document.getElementById("panel-close").focus();
  }
  function closePanel(updateHash = true) {
    if (!scrim.classList.contains("show")) return;
    scrim.classList.remove("show");
    scrim.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
    scrim.querySelectorAll("video").forEach(v => v.pause());
    if (updateHash) history.pushState("", document.title, location.pathname + location.search);
    lastCard?.focus();
  }
  document.getElementById("project-grid").addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    lastCard = card;
    location.hash = card.dataset.slug;
  });
  function route() { const s = location.hash.slice(1); s ? openPanel(s) : closePanel(false); }
  addEventListener("hashchange", route);
  document.getElementById("panel-close").addEventListener("click", () => closePanel());
  scrim.addEventListener("click", e => { if (e.target === scrim) closePanel(); });
  addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
  route();

  // ── Light by default, like the reference ──
  const root = document.documentElement;
  document.getElementById("theme").addEventListener("click", () => {
    const dark = root.dataset.theme !== "dark";
    root.dataset.theme = dark ? "dark" : "light";
    document.getElementById("sun").style.display = dark ? "none" : "";
    document.getElementById("moon").style.display = dark ? "" : "none";
  });
</script>
</body>
</html>
