<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .light-badge { display: block; }
    .dark-badge { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-badge { display: none; }
      .dark-badge { display: block; }
    }
  </style>
  <image class="light-badge" href="data:image/png;base64," width="180" height="180" />
  <image class="dark-badge" href="data:image/png;base64," width="180" height="180" />
</svg>
